name: Deploy Storefront
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: store-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  verify-notifications:
    env:
      APP_ENV: test
      DB_SCHEMA_AUTO_MIGRATE: '1'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gingtto_store_notifications_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment script syntax
        run: bash -n scripts/deploy-storefront.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: storefront-backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_store_notifications_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: pip install pip-audit==2.10.1 -r requirements.txt && python -m unittest -v test_security_phase1 test_security test_safe_images_transport test_order_currency test_order_notifications test_order_numbering test_sales_ownership test_temporary_inbound test_inventory_overdelivery test_product_weights test_style_catalog test_storefront_english && python ../scripts/verify-inventory-overdelivery.py storefront-backend && python ../scripts/verify-product-weights.py storefront-backend && python ../scripts/verify-style-catalog.py storefront-backend
      - name: Dependency and credential checks
        run: |
          python -m pip_audit -r storefront-backend/requirements.txt
          python scripts/security-secret-scan.py
          python -m unittest discover -s scripts/security -p 'test_*.py' -v
          docker run --rm --network none --cap-add SYS_PTRACE -e SECURITY_RELEASE_FIXTURE=1 --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/security,dst=/fixture,readonly" python:3.12-slim python /fixture/test_release_control_linux.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify English storefront and build
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high && node --test src/storefront/utils/*.test.js src/storefront/stores/*.test.js src/storefront/views/*.test.js && npm run build
  deploy:
    needs: verify-notifications
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Backend/transaction tests already ran with the isolated PostgreSQL
      # service in verify-notifications. Never run fixtures in a deploy job
      # without its explicit *_test database boundary.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && node --test src/storefront/utils/*.test.js src/storefront/stores/*.test.js src/storefront/views/*.test.js && npm run build
      - name: Package release without runtime data or secrets
        run: |
          python scripts/security/build_release.py --channel store --output release.tar.gz
          python scripts/security/build_release.py --channel store --verify release.tar.gz
      - name: Upload, back up and deploy over verified SSH
        env:
          DEPLOY_HOST: ${{ secrets.SECURITY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SECURITY_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SECURITY_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SECURITY_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          test "$DEPLOY_USER" = gingtto-deploy
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-known-hosts"
          trap 'rm -f -- "$RUNNER_TEMP/deploy-key"' EXIT
          opts=(-i "$RUNNER_TEMP/deploy-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/deploy-known-hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15)
          release_id=store-${{ github.run_id }}-${{ github.run_attempt }}
          stage=/opt/smawell/incoming/$release_id
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; mkdir -p '$stage'"
          scp "${opts[@]}" release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$stage/release.tar.gz"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 '$stage/release.tar.gz' && sudo -n /usr/local/sbin/gingtto-release deploy store '$release_id'"
